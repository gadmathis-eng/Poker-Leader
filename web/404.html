<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pot Master</title>
  </head>
  <body>
    <script>
      (function () {
        var match = location.pathname.match(/\/table\/([^\/]+)\/?$/i);
        if (match && match[1]) {
          location.replace("/table/?code=" + encodeURIComponent(match[1].toUpperCase()));
          return;
        }
        location.replace("/");
      })();
    </script>
  </body>
</html>
